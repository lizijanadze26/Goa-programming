<!--მოცემულია სექციები .article და .sidebar. დაწერეთ სელექტორი, რომელიც ორივე ამ სექციაში მყოფ button და a ელემენტებს მისცემს ერთნაირ padding-ს.-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        :is(.article, .sidebar) button, a {
            padding: 20px 40px;
        }
    </style>
</head>
<body>
    <article class="article">
        <button>Article Button</button>
        <a href="">Article Link</a>

    </article>
    <aside class="sidebar">
        <button>Sidebar Button</button>
        <a href="">Sidebar Link</a>
</body>
</html>
