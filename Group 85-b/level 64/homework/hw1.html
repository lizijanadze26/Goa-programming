<!--გაქვთ სათაურები: h1, h2 და h3. დაწერეთ ერთი მოკლე სელექტორი :is()-ის გამოყენებით, რომელიც სამივეს ერთდროულად გაალურჯებს, ისე რომ სათითაოდ ჩამოწერა არ დაგჭირდეთ.-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
    <style>
        :is(h1, h2, h3) {
            color: blue;
        }
    </style>
</head>
<body>
    <h1>Heading 1</h1>
    <h2>Heading 2</h2>
    <h3>Heading 3</h3>

</body>
</html>
